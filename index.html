<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#302e2b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chess Mentor" />
    <meta name="description" content="A Duolingo-style chess opening coach with spaced repetition." />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Chess Mentor</title>
  </head>
  <body>
    <div id="app">
      <div id="splash" style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-family:-apple-system,system-ui,sans-serif;color:#d9d8d6;background:#302e2b">
        <div style="font-size:72px;color:#f3dfbf">♞</div>
        <div id="splash-msg" style="font-size:17px">Loading Chess Mentor…</div>
      </div>
    </div>
    <script>
      // If the app bundle never starts, explain instead of leaving a blank screen.
      window.__bootTimer = setTimeout(function () {
        var m = document.getElementById('splash-msg');
        if (m) m.innerHTML = '<b>Chess Mentor didn’t start.</b><br><br>Close the app completely and open it again.<br><br>If this keeps happening, the site is serving the source files instead of the built app: in the GitHub repo set <b>Settings → Pages → Source</b> to <b>GitHub Actions</b>.';
      }, 8000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
